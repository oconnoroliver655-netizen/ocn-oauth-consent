name: MCP ping-only canary validation
on:
  push:
    branches:
      - feature/render-mcp-ping-canary-20261012
    paths:
      - "canary/mcp/**"
      - ".github/workflows/render-mcp-canary.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check syntax, test constrained transport
        run: |
          node --version
          node --check canary/mcp/server.mjs
          node --check canary/mcp/tests/server.test.mjs
          node --test canary/mcp/tests/server.test.mjs
      - name: No privileged dependencies or credentials
        run: |
          if grep -REn '(sb_secret_[A-Za-z0-9_-]{8,}|ghp_[A-Za-z0-9]{20,}|eyJ[A-Za-z0-9_-]{60,})' canary/mcp; then exit 1; fi
