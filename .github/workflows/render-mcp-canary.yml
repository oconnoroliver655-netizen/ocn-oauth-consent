name: MCP ping-only canary validation
on:
  push:
    branches:
      - feature/render-mcp-ping-canary-20261012
    paths:
      - "canary/mcp/**"
      - ".github/workflows/render-mcp-canary.yml"
  pull_request:
    paths:
      - "canary/mcp/**"
      - "supabase/functions/ocn-owner-health-dispatch/**"
      - "tests/queue-pressure-edge.test.mjs"
      - ".github/workflows/render-mcp-canary.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check syntax, test constrained transport
        run: |
          node --version
          node --check canary/mcp/server.mjs
          node --check canary/mcp/tests/server.test.mjs
          node --check canary/mcp/windows-tools.mjs
          node --check canary/mcp/tests/admin-power-routing.test.mjs
          node --check canary/mcp/route-policy.mjs
          node --check canary/mcp/router-mcp.mjs
          node --check canary/mcp/tests/route-policy.test.mjs
          node --check canary/mcp/tests/router-mcp.test.mjs
          node --check supabase/functions/ocn-owner-health-dispatch/queue-pressure.mjs
          node --check tests/queue-pressure-edge.test.mjs
          node --check canary/mcp/optional-diagnostic-admission.mjs
          node --check canary/mcp/tests/optional-diagnostic-admission.test.mjs
          node --check canary/mcp/tests/optional-diagnostic-mcp-e2e-mock.test.mjs
          node --test canary/mcp/tests/server.test.mjs canary/mcp/tests/admin-power-routing.test.mjs canary/mcp/tests/route-policy.test.mjs canary/mcp/tests/router-mcp.test.mjs canary/mcp/tests/optional-diagnostic-admission.test.mjs canary/mcp/tests/optional-diagnostic-mcp-e2e-mock.test.mjs tests/queue-pressure-edge.test.mjs
      - name: No privileged dependencies or credentials
        run: |
          if grep -REn '(sb_secret_[A-Za-z0-9_-]{8,}|ghp_[A-Za-z0-9]{20,}|eyJ[A-Za-z0-9_-]{60,})' canary/mcp; then exit 1; fi
